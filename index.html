    body {

    /* El Yazısı Fontu */
    .font-handwriting {
      font-family: 'Caveat', cursive;
    }

    /* Daktilo / Kalemle Yazılma Efekti */
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }
    @keyframes blink-caret {
      from, to { border-color: transparent; }
      50% { border-color: #6b46ff; }
    }
    @keyframes hide-caret {
      to { border-right-color: transparent; }
    }
    .handwriting-anim {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      width: 0;
      border-right: 3px solid #6b46ff;
      animation: typing 2.2s cubic-bezier(0.4, 0, 0.2, 1) 0.2s forwards,
                 blink-caret 0.7s step-end infinite,
                 hide-caret 0.1s 2.9s forwards;
    }

    /* Soldan Sağa Çizilen Zarif Akıcı Alt Çizgi */
    @keyframes draw-line {
      to {
        stroke-dashoffset: 0;
      }
    }
    .handwriting-underline {
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: draw-line 1.1s cubic-bezier(0.4, 0, 0.2, 1) 2.1s forwards;
    }

    /* Kart Açılış Animasyonu (Spring / Pop-in) */
    @keyframes popInUp {
      0% {
        opacity: 0;
        transform: translateY(32px) scale(0.92);
      }
      65% {
        opacity: 1;
        transform: translateY(-6px) scale(1.02);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-pop-in {
      animation: popInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
  </style>
</head>

  <!-- Drawer Menü JS Etkileşimi -->
  <script>
    const openBtn = document.getElementById('open-menu-btn');
    const closeBtn = document.getElementById('close-menu-btn');
    const drawerOverlay = document.getElementById('drawer-overlay');
    const drawerPanel = document.getElementById('drawer-panel');
    const drawerMenu = document.getElementById('drawer-menu');
    let drawerTimeout = null;

    function openDrawer() {
      if (drawerTimeout) clearTimeout(drawerTimeout);
      drawerMenu.classList.remove('pointer-events-none', 'invisible');
      drawerMenu.classList.add('pointer-events-auto', 'visible');
      // Reflow tetikleyerek CSS transition'ın sorunsuz başlamasını sağla
      void drawerMenu.offsetWidth;
      drawerOverlay.classList.remove('opacity-0');
      drawerOverlay.classList.add('opacity-100');
      drawerPanel.classList.remove('-translate-x-full');
      drawerPanel.classList.add('translate-x-0');
    }

    function closeDrawer() {
      drawerOverlay.classList.remove('opacity-100');
      drawerOverlay.classList.add('opacity-0');
      drawerPanel.classList.remove('translate-x-0');
      drawerPanel.classList.add('-translate-x-full');
      drawerTimeout = setTimeout(() => {
        drawerMenu.classList.remove('pointer-events-auto', 'visible');
        drawerMenu.classList.add('pointer-events-none', 'invisible');
      }, 500);
    }

    if (openBtn) openBtn.addEventListener('click', openDrawer);
    if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
    if (drawerOverlay) drawerOverlay.addEventListener('click', closeDrawer);
  </script>

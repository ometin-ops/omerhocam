<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ömer Hoca — Yeni Nesil Matematik</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Caveat (El Yazısı), Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@700;800;900&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }

    /* El Yazısı Fontu */
    .font-handwriting {
      font-family: 'Caveat', cursive;
    }

    /* Daktilo / Kalemle Yazılma Efekti */
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }
    @keyframes blink-caret {
      from, to { border-color: transparent; }
      50% { border-color: #6b46ff; }
    }
    @keyframes hide-caret {
      to { border-right-color: transparent; }
    }
    .handwriting-anim {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      width: 0;
      border-right: 3px solid #6b46ff;
      animation: typing 2.2s cubic-bezier(0.4, 0, 0.2, 1) 0.2s forwards,
                 blink-caret 0.7s step-end infinite,
                 hide-caret 0.1s 2.9s forwards;
    }

    /* Soldan Sağa Çizilen Dalgalı Çizgi (Squiggly Underline) */
    @keyframes draw-line {
      to {
        stroke-dashoffset: 0;
      }
    }
    .handwriting-underline {
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: draw-line 1.1s cubic-bezier(0.4, 0, 0.2, 1) 2.1s forwards;
    }

    /* Kart Açılış Animasyonu (Spring / Pop-in) */
    @keyframes popInUp {
      0% {
        opacity: 0;
        transform: translateY(48px) scale(0.9);
      }
      65% {
        opacity: 1;
        transform: translateY(-8px) scale(1.03);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-pop-in {
      animation: popInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
  </style>
</head>
<body class="bg-[#d4ff00] relative min-h-screen w-full flex flex-col items-center justify-start p-0 m-0 select-none selection:bg-[#6b46ff] selection:text-[#d4ff00] overflow-x-hidden">

  <!-- ========================================================================= -->
  <!-- 2. TAM GENİŞLİKTE RESPONSİVE KARŞILAMA AFİŞİ (Masaüstü: w2.png, Mobil: w3.png) -->
  <!-- ========================================================================= -->
  <div class="w-full p-0 m-0 relative z-0 flex items-center justify-center overflow-hidden">
    <!-- Mobil Görsel (w3.png - Dikey Tasarım) -->
    <img 
      src="/w3.png" 
      alt="Ömer Hoca & Raku - Hoş Geldin" 
      class="block md:hidden w-full h-auto object-cover" 
    />
    <!-- Masaüstü Görsel (w2.png - Yatay Banner) -->
    <img 
      src="/w2.png" 
      alt="Ömer Hoca & Raku - Hoş Geldin" 
      class="hidden md:block w-full h-auto object-cover" 
    />
  </div>

  <!-- ========================================================================= -->
  <!-- 3. ANA İÇERİK: EL YAZISI BAŞLIK & 4'LÜ KART IZGARASI -->
  <!-- ========================================================================= -->
  <main class="relative z-20 w-full max-w-6xl mx-auto flex flex-col items-center justify-center px-4 sm:px-6 pt-6 pb-14 md:pb-20 my-auto">
    
    <!-- El Yazısı Animasyonlu Başlık ('Ömer Hoca - Matematik Öğretmeni') -->
    <div class="relative inline-block -rotate-1 px-4 mb-8 md:mb-12 text-center">
      <h1 class="handwriting-anim text-3xl sm:text-4xl md:text-5xl font-bold font-handwriting text-slate-900 tracking-wide pb-1">
        Ömer Hoca <span class="text-[#6b46ff]">- Matematik Öğretmeni</span>
      </h1>

      <!-- Soldan Sağa Çizilen Zarif Akıcı Alt Çizgi (Smooth Swoosh Underline) -->
      <svg
        class="absolute -bottom-2 sm:-bottom-3 left-0 w-full h-3 sm:h-4 text-slate-900 overflow-visible pointer-events-none"
        viewBox="0 0 350 16"
        fill="none"
        preserveAspectRatio="none"
      >
        <path
          d="M 4 8 C 110 13, 240 13, 346 7"
          stroke="currentColor"
          stroke-width="2.8"
          stroke-linecap="round"
          class="handwriting-underline"
        />
      </svg>
    </div>

    <!-- 4 Mor Kart Izgarası: Mobilde 2'li (2 Satır), Masaüstünde 4'lü (Tek Satır) -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 w-full max-w-6xl mx-auto px-4">

      <!-- 1. KART: ÖZEL DERS (Gecikme: 50ms) -->
      <a href="/ozel-ders.html" 
         class="animate-pop-in group bg-[#6b46ff] w-full aspect-square rounded-[1.75rem] md:rounded-[2.25rem] flex flex-col items-center justify-center p-4 sm:p-5 md:p-6 shadow-xl shadow-purple-950/20 hover:-translate-y-4 hover:scale-105 hover:shadow-2xl hover:shadow-purple-950/40 transition-all duration-300 ease-out cursor-pointer active:scale-95 no-underline"
         style="animation-delay: 50ms;">
        <!-- İkon: Roket -->
        <div class="w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 flex items-center justify-center">
          <img src="/roket.png" 
               alt="Özel Ders İkonu" 
               class="w-full h-full object-contain filter drop-shadow-md group-hover:scale-115 group-hover:-rotate-6 transition-transform duration-300 ease-out" />
        </div>
        <!-- Başlık -->
        <h2 class="font-extrabold text-base sm:text-lg md:text-xl lg:text-2xl text-[#d4ff00] mt-2 sm:mt-3 md:mt-4 text-center tracking-tight">
          Özel Ders
        </h2>
        <!-- Kavisli Alt Çizgi -->
        <svg class="w-16 sm:w-20 md:w-24 h-2 sm:h-2.5 text-[#d4ff00] mt-1 transition-transform duration-300 ease-out group-hover:scale-110 group-hover:-translate-y-0.5" viewBox="0 0 100 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 8.5C28 11.5 72 10.5 97 3.5" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" />
        </svg>
      </a>

      <!-- 2. KART: KÜTÜPHANE (Gecikme: 150ms) -->
      <a href="/kutuphane" 
         class="animate-pop-in group bg-[#6b46ff] w-full aspect-square rounded-[1.75rem] md:rounded-[2.25rem] flex flex-col items-center justify-center p-4 sm:p-5 md:p-6 shadow-xl shadow-purple-950/20 hover:-translate-y-4 hover:scale-105 hover:shadow-2xl hover:shadow-purple-950/40 transition-all duration-300 ease-out cursor-pointer active:scale-95 no-underline"
         style="animation-delay: 150ms;">
        <!-- İkon: Defter -->
        <div class="w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 flex items-center justify-center">
          <img src="/defter.png" 
               alt="Kütüphane İkonu" 
               class="w-full h-full object-contain filter drop-shadow-md group-hover:scale-115 group-hover:rotate-6 transition-transform duration-300 ease-out" />
        </div>
        <!-- Başlık -->
        <h2 class="font-extrabold text-base sm:text-lg md:text-xl lg:text-2xl text-[#d4ff00] mt-2 sm:mt-3 md:mt-4 text-center tracking-tight">
          Kütüphane
        </h2>
        <!-- Kavisli Alt Çizgi -->
        <svg class="w-16 sm:w-20 md:w-24 h-2 sm:h-2.5 text-[#d4ff00] mt-1 transition-transform duration-300 ease-out group-hover:scale-110 group-hover:-translate-y-0.5" viewBox="0 0 100 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 8.5C28 11.5 72 10.5 97 3.5" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" />
        </svg>
      </a>

      <!-- 3. KART: OYUNLAR (Gecikme: 250ms) -->
      <a href="/oyun-dukkani" 
         class="animate-pop-in group bg-[#6b46ff] w-full aspect-square rounded-[1.75rem] md:rounded-[2.25rem] flex flex-col items-center justify-center p-4 sm:p-5 md:p-6 shadow-xl shadow-purple-950/20 hover:-translate-y-4 hover:scale-105 hover:shadow-2xl hover:shadow-purple-950/40 transition-all duration-300 ease-out cursor-pointer active:scale-95 no-underline"
         style="animation-delay: 250ms;">
        <!-- İkon: Konsol -->
        <div class="w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 flex items-center justify-center">
          <img src="/konsol.png" 
               alt="Oyunlar İkonu" 
               class="w-full h-full object-contain filter drop-shadow-md group-hover:scale-115 group-hover:-rotate-6 transition-transform duration-300 ease-out" />
        </div>
        <!-- Başlık -->
        <h2 class="font-extrabold text-base sm:text-lg md:text-xl lg:text-2xl text-[#d4ff00] mt-2 sm:mt-3 md:mt-4 text-center tracking-tight">
          Oyunlar
        </h2>
        <!-- Kavisli Alt Çizgi -->
        <svg class="w-16 sm:w-20 md:w-24 h-2 sm:h-2.5 text-[#d4ff00] mt-1 transition-transform duration-300 ease-out group-hover:scale-110 group-hover:-translate-y-0.5" viewBox="0 0 100 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 8.5C28 11.5 72 10.5 97 3.5" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" />
        </svg>
      </a>

      <!-- 4. KART: MAĞAZA (Gecikme: 350ms) -->
      <a href="/magaza" 
         class="animate-pop-in group bg-[#6b46ff] w-full aspect-square rounded-[1.75rem] md:rounded-[2.25rem] flex flex-col items-center justify-center p-4 sm:p-5 md:p-6 shadow-xl shadow-purple-950/20 hover:-translate-y-4 hover:scale-105 hover:shadow-2xl hover:shadow-purple-950/40 transition-all duration-300 ease-out cursor-pointer active:scale-95 no-underline"
         style="animation-delay: 350ms;">
        <!-- İkon: Çanta -->
        <div class="w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 flex items-center justify-center">
          <img src="/canta.png" 
               alt="Mağaza İkonu" 
               class="w-full h-full object-contain filter drop-shadow-md group-hover:scale-115 group-hover:rotate-6 transition-transform duration-300 ease-out" />
        </div>
        <!-- Başlık -->
        <h2 class="font-extrabold text-base sm:text-lg md:text-xl lg:text-2xl text-[#d4ff00] mt-2 sm:mt-3 md:mt-4 text-center tracking-tight">
          Mağaza
        </h2>
        <!-- Kavisli Alt Çizgi -->
        <svg class="w-16 sm:w-20 md:w-24 h-2 sm:h-2.5 text-[#d4ff00] mt-1 transition-transform duration-300 ease-out group-hover:scale-110 group-hover:-translate-y-0.5" viewBox="0 0 100 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 8.5C28 11.5 72 10.5 97 3.5" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" />
        </svg>
      </a>

    </div>
  </main>

</body>
</html>
